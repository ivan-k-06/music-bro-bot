spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:music_bot_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secret123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

telegram:
  bot:
    name: ${BOT_NAME}
    token: ${BOT_TOKEN}

lastfm:
  api:
    url: http://ws.audioscrobbler.com/2.0/
    key: ${LASTFM_API_KEY}
    secret: ${SHARED_SECRET}